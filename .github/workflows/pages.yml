name: Сайт editorstudio.ru

on:
  push:
    branches: [main]
  workflow_dispatch:
  # doajmds живёт в своём репозитории: раз в сутки забираем свежую версию
  schedule:
    - cron: "17 3 * * *"
  # мгновенная пересборка из doajmds (нужен токен там, см. README)
  repository_dispatch:
    types: [doajmds-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Забрать doajmds
        uses: actions/checkout@v4
        with:
          repository: tsentavta/doajmds
          path: _doajmds

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать сайт
        run: python tools/build_site.py --doaj _doajmds --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
